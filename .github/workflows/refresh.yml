name: Refresh the NameBio aggregate edition
on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-namebio-aggregates
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect NameBio extension totals
        run: python collectors/namebio.py
      - run: python -m unittest discover -s tests -v && python scripts/build.py
      - name: Preserve the validated edition and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/market.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh reported domain sales aggregates'
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --ref main
